[project]
name = "hawkesdiffusion"
version = "0.1.0"
description = "Bivariate Hawkes modelling of self- and cross-excitation in real event streams, with the goodness-of-fit test that decides whether the model may be believed."
requires-python = ">=3.11"
license = { text = "LicenseRef-Leo-Y-Zhang-Proprietary" }
dependencies = [
  # scipy is required, not optional: the optimiser, the sparse routines and the
  # Kolmogorov-Smirnov test are all from it, and the KS test is the part that
  # decides whether a fit may be reported at all.
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["ruff>=0.6"]

[project.scripts]
hawkesdiffusion = "hawkesdiffusion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are fine here; the prose in docstrings carries meaning
  "B905",   # zip() without strict=: every zip in this codebase pairs sequences
            # that are the same length by construction, and adding strict=True
            # everywhere would be noise rather than a check
  "E741",   # a single-letter name is occasionally the clearest one in maths code
  "E402",   # a few modules deliberately import after a sys.path or backend setup
]
